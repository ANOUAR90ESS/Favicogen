name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check the assets the manifest promises are present
        run: |
          set -e
          for asset in icon-192.png icon-512.png favicon.svg manifest.json \
                       fonts/fonts.css fonts/LICENSE.txt \
                       legal/PRIVACY_POLICY.md legal/PRIVACY_POLICY.ar.md \
                       legal/TERMS_OF_SERVICE.md legal/TERMS_OF_SERVICE.ar.md; do
            test -f "dist/$asset" || { echo "missing dist/$asset"; exit 1; }
          done
          echo "all declared assets present"

      - name: Check nothing reaches for Google Fonts at run time
        run: |
          set -e
          # The typefaces ship with the app. A reintroduced link or fetch would
          # bring back exports that silently lose their font offline.
          if grep -rn "fonts.googleapis.com\|fonts.gstatic.com" dist/assets dist/index.html; then
            echo "the built app still references Google Fonts"
            exit 1
          fi
          test "$(ls dist/fonts/*.woff2 | wc -l)" -gt 40 || { echo "font files missing from the build"; exit 1; }
          echo "self-hosted: no Google Fonts references in the build"

      - name: Check the app can still be installed and run offline
        run: |
          set -e
          # A missing service worker is not a build error — the app just
          # quietly stops being installable and stops working offline.
          test -f dist/sw.js || { echo "no service worker in the build"; exit 1; }
          test -f dist/manifest.json || { echo "no web app manifest"; exit 1; }
          # The shell and every lazy chunk have to be in the precache, or an
          # offline reload lands on a blank page.
          test "$(grep -c 'index.html' dist/sw.js)" -ge 1 || { echo "index.html is not precached"; exit 1; }
          test "$(grep -c 'fonts/fonts.css' dist/sw.js)" -ge 1 || { echo "the font stylesheet is not precached"; exit 1; }
          # And the things that must never be in it.
          if grep -qE 'url:"fonts/[^"]*woff2"' dist/sw.js; then echo "font subsets should be runtime-cached, not precached"; exit 1; fi
          if grep -q 'server.cjs' dist/sw.js; then echo "the express server is in the precache"; exit 1; fi
          echo "service worker present, precache looks right"

      - name: Check both locales define the same keys
        run: bun run check:i18n
